name: hospedacheck_mobile
description: HospedaCheck - Gestión de visitantes y envío a SES Hospedajes
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  intl: ^0.20.2
  signature: ^5.4.0
  connectivity_plus: ^6.0.0
  flutter_local_notifications: ^18.0.0
  url_launcher: ^6.2.2
  google_mlkit_text_recognition: ^0.13.0
  camera: ^0.10.6
  image_picker: ^1.0.7
  permission_handler: ^11.2.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  pull_to_refresh: ^2.0.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/i18n/
