services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: checkin-app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - vendor_volume:/var/www/vendor
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=checkin
      - DB_USERNAME=checkin
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - COMPOSER_PROCESS_TIMEOUT=0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - checkin-network

  web:
    image: nginx:1.27-alpine
    container_name: checkin-web
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - vendor_volume:/var/www/vendor
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - checkin-network

  db:
    image: mysql:8.0
    container_name: checkin-db
    ports: []
    environment:
      MYSQL_DATABASE: checkin
      MYSQL_USER: checkin
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - checkin-network

  redis:
    image: redis:7-alpine
    container_name: checkin-redis
    ports: []
    volumes:
      - redis_data:/data
    networks:
      - checkin-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: checkin-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - checkin-network

  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: checkin-horizon
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - vendor_volume:/var/www/vendor
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=checkin
      - DB_USERNAME=checkin
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - COMPOSER_PROCESS_TIMEOUT=0
    command: php artisan horizon
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - checkin-network

  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: checkin-scheduler
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - vendor_volume:/var/www/vendor
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=checkin
      - DB_USERNAME=checkin
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - COMPOSER_PROCESS_TIMEOUT=0
    command: php artisan schedule:work
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - checkin-network

networks:
  checkin-network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  vendor_volume:
